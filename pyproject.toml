[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roverguard"
version = "0.2.1"
description = "Differential-drive navigation from PyBullet to embedded C++"
requires-python = ">=3.11"
dependencies = ["pybullet==3.2.7"]

[tool.setuptools.packages.find]
include = ["roverguard*"]

