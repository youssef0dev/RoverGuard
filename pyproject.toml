[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roverguard"
version = "0.3.0"
description = "Safe local-LLM missions for a differential-drive inspection robot"
requires-python = ">=3.11"
dependencies = ["pybullet==3.2.7"]

[tool.setuptools.packages.find]
include = ["roverguard*"]

