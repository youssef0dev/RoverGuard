[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roverguard"
version = "0.4.0"
description = "Data-driven multi-point missions for a safe differential-drive robot"
requires-python = ">=3.11"
dependencies = ["pybullet==3.2.7"]

[tool.setuptools.packages.find]
include = ["roverguard*"]

